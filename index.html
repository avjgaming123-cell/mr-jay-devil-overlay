<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MR JAY DEVIL LIVE — Anime Subscriber Overlay</title>
<style>
:root{--lime:#b8ff3b;--cyan:#40f7ff;--pink:#ff3da8;--bg:#050914}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;font-family:Arial,Helvetica,sans-serif;color:#fff}
.wrap{position:relative;display:flex;align-items:center;gap:16px;padding:13px 22px 14px 15px;min-width:340px;border:1px solid rgba(64,247,255,.85);border-left:4px solid var(--lime);border-radius:12px;background:linear-gradient(110deg,rgba(4,8,22,.96),rgba(12,22,45,.91) 58%,rgba(20,6,32,.93));box-shadow:0 0 18px #40f7ff32,inset 0 0 20px #40f7ff0b;isolation:isolate;animation:rise 3.5s ease-in-out infinite}
.wrap:before{content:"";position:absolute;inset:0;border-radius:12px;background:linear-gradient(115deg,transparent 20%,#40f7ff12 48%,transparent 75%);transform:translateX(-120%);animation:sweep 5s linear infinite;pointer-events:none;z-index:-1}
.slash{width:56px;height:56px;display:grid;place-items:center;flex-shrink:0;position:relative;border:1px solid var(--lime);border-radius:10px;background:linear-gradient(145deg,#172b39,#101020);clip-path:polygon(14% 0,100% 0,100% 82%,84% 100%,0 100%,0 18%);font-size:29px;font-weight:900;color:var(--lime);text-shadow:0 0 12px #b8ff3b8a}
.slash:after{content:"";position:absolute;left:7px;right:7px;bottom:5px;height:2px;background:var(--pink);box-shadow:0 0 8px var(--pink)}
.info{display:flex;flex-direction:column;gap:5px;min-width:142px}
.brand{font-size:14px;font-weight:900;letter-spacing:1.6px;color:#fff;text-shadow:0 0 8px #40f7ff70;white-space:nowrap}
.live{display:flex;align-items:center;gap:6px;font-size:9px;letter-spacing:2px;font-weight:900;color:var(--pink)}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--pink);box-shadow:0 0 9px var(--pink);animation:blink 1s infinite}
.rule{height:1px;width:100%;background:linear-gradient(90deg,var(--lime),transparent)}
.counter{display:flex;flex-direction:column;align-items:flex-end;gap:3px;margin-left:4px}
.count{font-size:29px;line-height:1;font-weight:900;letter-spacing:.5px;color:var(--lime);font-variant-numeric:tabular-nums;text-shadow:0 0 13px #b8ff3b58;transition:transform .2s}
.caption{font-size:8px;letter-spacing:2px;font-weight:900;color:var(--cyan)}
.status{position:absolute;right:10px;top:5px;font-size:7px;letter-spacing:1px;color:#a9b6ca}
@keyframes blink{50%{opacity:.3}}@keyframes rise{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@keyframes sweep{to{transform:translateX(120%)}}@keyframes pop{50%{transform:scale(1.09)}}
@media(max-width:400px){.wrap{min-width:300px;gap:10px;padding:12px}.slash{width:46px;height:46px;font-size:24px}.brand{font-size:12px}.count{font-size:25px}.info{min-width:126px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="slash">J</div>
  <div class="info">
    <div class="brand">MR JAY DEVIL LIVE</div>
    <div class="live"><span class="pulse"></span> LIVE • SUBSCRIBERS</div>
    <div class="rule"></div>
  </div>
  <div class="counter">
    <div class="status" id="status">DEMO MODE</div>
    <div class="count" id="count">—</div>
    <div class="caption">TOTAL SUBS</div>
  </div>
</div>
<script>
/*
SETUP:
1. Create a YouTube Data API v3 key in Google Cloud Console.
2. Replace and YOUR_CHANNEL_ID below.
3. Host this HTML on HTTPS (e.g. GitHub Pages), then use that page URL in PRISM Live.
For a public static overlay, the key is visible to viewers. Restrict it to YouTube Data API v3
and your hosted site's HTTP referrer in Google Cloud Console. Never use a private server key here.
*/
const API_KEY = "AIzaSyaDF4ET8vYfrbeXvl";
const CHANNEL_ID = "UCchN8UHBUo6wPz8PtckgSGw";
const REFRESH_MS = 120000; // refresh every 2 minutes
const countEl = document.getElementById("count");
const statusEl = document.getElementById("status");
let shown = null;
function animateCount(next) {
  const from = shown === null ? next : shown;
  const start = performance.now(), duration = 800;
  function frame(now) {
    const p = Math.min(1, (now-start)/duration), eased = 1-Math.pow(1-p,3);
    countEl.textContent = Math.round(from+(next-from)*eased).toLocaleString("en-US");
    if(p<1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame); shown = next;
  countEl.style.animation = "pop .35s ease";
  setTimeout(()=>countEl.style.animation="",380);
}
async function refresh() {
  if(API_KEY==="AIzaSyDF4ET8vYfrbeXvl" || CHANNEL_ID==="YOUR_CHANNEL_ID") {
    statusEl.textContent = "SETUP NEEDED"; countEl.textContent = "—"; return;
  }
  try {
    const url = `https://www.googleapis.com/youtube/v3/channels?part=statistics&id=${encodeURIComponent(CHANNEL_ID)}&key=${encodeURIComponent(API_KEY)}`;
    const res = await fetch(url);
    if(!res.ok) throw new Error("API request failed");
    const data = await res.json();
    const item = data.items && data.items[0];
    if(!item || !item.statistics || item.statistics.subscriberCount == null) throw new Error("Channel not found or count hidden");
    animateCount(Number(item.statistics.subscriberCount));
    statusEl.textContent = "LIVE DATA";
  } catch(e) {
    statusEl.textContent = "CHECK SETUP";
    if(shown===null) countEl.textContent = "—";
  }
}
refresh();
setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
